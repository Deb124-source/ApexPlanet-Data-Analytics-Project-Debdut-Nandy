
name: Retail Analytics Automation

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 03:30 UTC (09:00 IST)
    - cron: "30 3 * * 1"

jobs:
  run-retail-analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retail automation
        run: |
          python scripts/retail_automation.py \
            --input "data/Online Retail.xlsx" \
            --output "outputs"

      - name: Verify generated files
        run: |
          test -s outputs/online_retail_cleaned.csv
          test -s outputs/retail_analytics_report.xlsx
          echo "Both output files generated successfully."

      - name: Upload analytics outputs
        uses: actions/upload-artifact@v4
        with:
          name: retail-analytics-results
          path: |
            outputs/online_retail_cleaned.csv
            outputs/retail_analytics_report.xlsx
          retention-days: 30
          if-no-files-found: error
